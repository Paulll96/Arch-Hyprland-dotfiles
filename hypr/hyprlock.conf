background {
    monitor =
    path = /usr/share/sddm/themes/sddm-astronaut-theme/Backgrounds/current-wallpaper.png
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2

    dots_size = 0.2
    dots_spacing = 0.2

    outer_color = rgb(151515)
    inner_color = rgb(101010)
    font_color = rgb(ffffff)

    fade_on_empty = false
    rounding = 15

    placeholder_text = Password...
    hide_input = false

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M %p')"

    color = rgba(255,255,255,1.0)

    font_size = 64
    font_family = JetBrainsMono Nerd Font

    position = 0, 80
    halign = center
    valign = center
}
label {
   text =  
    color = rgba(255,255,255,0.9)

    font_size = 36
   font_family = Symbols Nerd Font

    position = -100, -120
    halign = center
    valign = center

    onclick = systemctl poweroff
}

label {
    text = 󰜉
    color = rgba(255,255,255,0.9)

    font_size = 36
   font_family = Symbols Nerd Font

    position = 0, -120
    halign = center
    valign = center

    onclick = systemctl reboot
}

label {
    text = 󰤄
    color = rgba(255,255,255,0.9)

    font_size = 36
    font_family = Symbols Nerd Font

    position = 100, -120
    halign = center
    valign = center

    onclick = systemctl suspend
}

